name: Build ImageMaps

# Se déclenche à chaque push, à chaque pull request,
# et manuellement via l'onglet "Actions" de GitHub (bouton "Run workflow").
on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build avec Maven
        run: mvn -B clean package

      - name: Récupérer le jar compilé
        uses: actions/upload-artifact@v4
        with:
          name: ImageMaps-jar
          path: target/ImageMaps.jar
          if-no-files-found: error
