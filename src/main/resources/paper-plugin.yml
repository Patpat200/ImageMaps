name: ImageMaps
version: '2.0.0'
main: org.saltzus.imagemaps.ImageMapsPlugin
api-version: '26.2'
author: saltzus
description: Affiche des images sur des cartes Minecraft, avec chargement asynchrone, cache disque et résolution automatique des liens (Dropbox, Google Drive, pages avec balise og:image, etc).

commands:
  imagemap:
    description: Gère les cartes-images.
    usage: /imagemap <create|reload|remove|clearcache|list> [args]
    permission: imagemaps.admin

permissions:
  imagemaps.admin:
    description: Autorise la gestion des cartes-images.
    default: op
